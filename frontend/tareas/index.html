<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mis Tareas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  
  <header>
    <h1>Mis Tareas</h1>
    <button id="btn-crear">+ Nueva tarea</button>
  </header>

  <div class="filtros">
    <button class="filtro activo" data-filtro="todas">Todas</button>
    <button class="filtro" data-filtro="pendientes">Pendientes</button>
    <button class="filtro" data-filtro="completadas">Completadas</button>
    <input type="text" id="inputBuscar" placeholder="Buscar..." style="padding: 5px; margin-left: 10px;">
    <button id="btnBuscar">Buscar</button>
  </div>

  <ul id="lista-tareas">
  </ul>
<script src="index.js"></script>
</body>
</html>
